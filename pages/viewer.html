<section class="page-stack">

    <!-- CSV shell: controls panel + table. Hidden for non-CSV views. -->
    <div id="tableShell" class="page-stack">

        <div class="card card--sm viewer-controls">
            <div class="viewer-search">
                <span class="viewer-search__icon" aria-hidden="true">🔍</span>
                <input type="text" id="tableSearch" placeholder="Search..." autocomplete="off" />
            </div>

            <!-- column toggles generated by viewer.js -->
            <div id="columnToggles"></div>
        </div>

        <div class="card card--flat" style="padding:0;">
            <div class="table-wrapper">
                <table id="tableData" class="table is-striped">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TXT shell: rendered as lightweight markup. Hidden until a txt file is viewed. -->
    <div id="textView" class="card hidden"></div>

</section>

<script>
(function () {
    if (typeof loadView === "function") {
        loadView();
    }

    // Live search only applies to the CSV table.
    const searchInput = document.getElementById("tableSearch");
    if (searchInput) {
        searchInput.addEventListener("input", (e) => {
            const query = e.target.value.trim().toLowerCase();
            document.querySelectorAll("#tableData tbody tr").forEach(row => {
                const match = row.textContent.toLowerCase().includes(query);
                row.style.display = match ? "" : "none";
            });
        });
    }
})();
</script>
