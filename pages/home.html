<section id="home-page">

    <div class="hero">
        <div class="card" style="text-align:center;padding:3rem;">

            <h1>📄 CSV Dataset Browser</h1>

            <p>
                Browse available CSV datasets and open them directly in the viewer.
            </p>

        </div>
    </div>

    <div class="card" style="margin-top:2rem;">

        <h2>Available Datasets</h2>

        <div style="margin-top:1rem;">

            <input
                type="text"
                id="dataset-search"
                placeholder="Search by file name..."
                style="width:100%; padding:0.5rem; border-radius:6px; border:1px solid #ccc; margin-bottom:1rem;"
            />

            <div class="column-toggles" id="protection-toggles">

                <label class="toggle-all-item">
                    <input type="checkbox" class="column-checkbox" id="toggle-all" checked />
                    <span class="column-toggle-label">All</span>
                </label>

                <div class="column-selector">

                    <label class="column-toggle-item">
                        <input type="checkbox" class="column-checkbox toggle-mode" value="free" checked />
                        <span class="column-toggle-label">🔓 Free</span>
                    </label>

                    <label class="column-toggle-item">
                        <input type="checkbox" class="column-checkbox toggle-mode" value="protected" checked />
                        <span class="column-toggle-label">🔒 Protected</span>
                    </label>

                </div>

            </div>

        </div>

        <div
            id="dataset-list"
            class="card-group"
            style="margin-top:1rem;"
        ></div>

    </div>

</section>

<script>
(() => {

    // ============================================
    // CONFIGURATION
    // ============================================

    // null or [] -> show every dataset
    // ["Cafe"] -> only Cafe
    // ["Cafe", "Kos"] -> Cafe OR Kos
    const categories = null;

    const manifestPath = "data/manifest.json";

    // state
    let allFiles = [];
    let searchTerm = "";
    let activeModes = new Set(["free", "protected"]); // which modes are checked

    // ============================================
    // LOAD MANIFEST
    // ============================================

    async function loadManifest() {

        try {

            const response = await fetch(manifestPath);

            if (!response.ok) {
                throw new Error("Unable to load manifest.");
            }

            const manifest = await response.json();

            allFiles = filterByCategory(manifest);

            render();

        } catch (err) {

            console.error(err);

            document.getElementById("dataset-list").innerHTML = `
                <div class="card">
                    Failed to load manifest.
                </div>
            `;

        }

    }

    // ============================================
    // FILTERS
    // ============================================

    function filterByCategory(files) {

        if (!categories || categories.length === 0) {
            return files;
        }

        return files.filter(file =>
            categories.some(category =>
                file.label.includes(category)
            )
        );

    }

    function stripExtension(filename) {
        return filename.replace(/\.[^/.]+$/, "");
    }

    function applyFilters() {

        return allFiles.filter(file => {

            // protection filter
            const mode = file.password ? "protected" : "free";

            if (!activeModes.has(mode)) {
                return false;
            }

            // search filter (filename without extension)
            if (searchTerm) {
                const nameOnly = stripExtension(file.file).toLowerCase();
                if (!nameOnly.includes(searchTerm.toLowerCase())) {
                    return false;
                }
            }

            return true;

        });

    }

    // ============================================
    // RENDER LIST
    // ============================================

    function render() {
        buildDatasetList(applyFilters());
    }

    function buildDatasetList(files) {

        const container = document.getElementById("dataset-list");

        container.innerHTML = "";

        if (files.length === 0) {

            container.innerHTML = `
                <div class="card">
                    No datasets found.
                </div>
            `;

            return;

        }

        files.forEach(file => {

            const card = document.createElement("div");
            card.className = "card";

            const button = document.createElement("button");

            button.className = "button button--primary";
            button.textContent = "Open";

            if (file.password) {
                button.classList.add("button--warning");
            }

            button.addEventListener("click", () => openDataset(file));

            card.innerHTML = `
                <h3>${file.label.join(" ")}</h3>

                <p><strong>File:</strong> ${file.file}</p>

                <p>
                    ${
                        file.password
                            ? "🔒 Password Protected"
                            : "🔓 Public Dataset"
                    }
                </p>
            `;

            card.appendChild(button);

            container.appendChild(card);

        });

    }

    // ============================================
    // SEARCH + TOGGLE WIRING
    // ============================================

    function setupControls() {

        // search
        const searchInput = document.getElementById("dataset-search");

        searchInput.addEventListener("input", (e) => {
            searchTerm = e.target.value.trim();
            render();
        });

        // individual mode checkboxes
        const modeCheckboxes = document.querySelectorAll(".toggle-mode");
        const allCheckbox = document.getElementById("toggle-all");

        modeCheckboxes.forEach(cb => {

            cb.addEventListener("change", () => {

                activeModes = new Set(
                    Array.from(modeCheckboxes)
                        .filter(c => c.checked)
                        .map(c => c.value)
                );

                // sync "All" checkbox: checked only if every mode is checked
                allCheckbox.checked = activeModes.size === modeCheckboxes.length;

                render();

            });

        });

        // "All" checkbox toggles every mode checkbox
        allCheckbox.addEventListener("change", () => {

            const checked = allCheckbox.checked;

            modeCheckboxes.forEach(cb => {
                cb.checked = checked;
            });

            activeModes = checked
                ? new Set(Array.from(modeCheckboxes).map(c => c.value))
                : new Set();

            render();

        });

    }

    // ============================================
    // OPEN DATASET
    // ============================================

    async function openDataset(file) {

        if (file.password) {

            const entered = prompt("Enter password:");

            if (entered === null) {
                return;
            }

            if (entered !== file.password) {
                alert("Incorrect password.");
                return;
            }

        }

        window.__csvFile = file.file;

        htmx.ajax("GET", "/pages/loadCSV.html", {
            target: "#content",
            swap: "innerHTML"
        });

    }

    // ============================================
    // START
    // ============================================

    setupControls();
    loadManifest();

})();
</script>
