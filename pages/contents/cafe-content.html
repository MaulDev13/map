<div class="card card--flat">
    <div id="cafe-content"></div>
</div>

<script>
(function () {

    async function buildProjectLinks() {
        try {
            const res = await fetch("data/manifest.json");
            const files = await res.json();

            const container = document.getElementById("cafe-content");
            container.innerHTML = "";

            // Categories to display
            // OR logic: an item is shown if it contains ANY of these labels.
            const categories = ["Cafe"];

            const filteredFiles = files.filter(item =>
                categories.some(category => item.label.includes(category))
            );

            filteredFiles.forEach(item => {
                const link = document.createElement("button");

                link.className = "project-item";
                link.textContent = item.label.join(" ");

                // Kasih tanda visual kalau item ini butuh password
                if (item.password) {
                    link.classList.add("project-item--locked");
                }

                // Same behavior as navbar
                link.setAttribute("hx-get", "/pages/loadCSV.html");
                link.setAttribute("hx-target", "#content");
                link.setAttribute("hx-swap", "innerHTML");
                link.setAttribute("hx-indicator", "#loading");

                link.addEventListener("click", (e) => {
                    if (item.password) {
                        const enteredPassword = prompt("Enter password:");

                        // User cancel prompt (null) atau salah password
                        if (enteredPassword === null || enteredPassword !== item.password) {
                            if (enteredPassword !== null) {
                                alert("Incorrect password.");
                            }
                            e.preventDefault();
                            e.stopPropagation();
                            return;
                        }
                    }

                    window.__csvFile = item.file;

                    console.log("Selected CSV:", item.file);
                    console.log("Label:", item.label);
                });

                container.appendChild(link);
                container.appendChild(document.createElement("br"));

                // Activate HTMX for dynamically created elements
                htmx.process(link);
            });

        } catch (err) {
            console.error("Failed loading manifest:", err);
        }
    }

    buildProjectLinks();

})();
</script>
