<div class="card card--flat">
    <div id="hostelry-content"></div>
</div>

<script>
(function () {

    async function buildProjectLinks() {
        try {
            const res = await fetch("data/manifest.json");
            const files = await res.json();

            const container = document.getElementById("hostelry-content");
            container.innerHTML = "";

            // Categories to display
            // OR logic: an item is shown if it contains ANY of these labels.
            const categories = ["Kos"];

            const filteredFiles = files.filter(item =>
                categories.some(category => item.label.includes(category))
            );

            filteredFiles.forEach(item => {
                const link = document.createElement("button");

                link.className = "project-item";
                link.textContent = item.label.join(" ");

                // Kasih tanda visual kalau item ini butuh password
                if (item.password) {
                    link.classList.add("project-item--locked");
                }

                // Same behavior as navbar
                link.addEventListener("click", async () => {
                    if (item.password) {
                        const enteredPassword = prompt("Enter password:");

                        if (enteredPassword === null) {
                            return; // Stay on current page
                        }

                        if (enteredPassword !== item.password) {
                            alert("Incorrect password.");
                            return; // Stay on current page
                        }
                    }

                    window.__csvFile = item.file;

                    htmx.ajax("GET", "/pages/loadCSV.html", {
                        target: "#content",
                        swap: "innerHTML"
                    });
                });

                container.appendChild(link);
                container.appendChild(document.createElement("br"));

                // Activate HTMX for dynamically created elements
                htmx.process(link);
            });

        } catch (err) {
            console.error("Failed loading manifest:", err);
        }
    }

    buildProjectLinks();

})();
</script>
