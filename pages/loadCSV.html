<section class="page-stack">
    <div class="card card--sm">
        <input
            type="text"
            id="tableSearch"
            placeholder="Cari..."
            style="width:100%; padding: var(--space-sm) var(--space-md); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:var(--text-sm); background:var(--surface); color:var(--text-body);"
        />
    </div>

    <div class="card card--sm column-selector" id="columnToggles">
        <!-- checkbox kolom akan digenerate otomatis oleh JS -->
    </div>

    <div class="card card--flat" style="padding:0;">
        <div class="table-wrapper">
            <table id="tableData" class="table is-striped">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

</section>

<script>
(function () {
    if (typeof loadCSV === "function") {
        loadCSV();
    }

    const searchInput = document.getElementById("tableSearch");
    if (searchInput) {
        searchInput.addEventListener("input", (e) => {
            const query = e.target.value.trim().toLowerCase();
            const rows = document.querySelectorAll("#tableData tbody tr");
            let visibleCount = 0;

            rows.forEach(row => {
                const match = row.textContent.toLowerCase().includes(query);
                row.style.display = match ? "" : "none";
                if (match) visibleCount++;
            });

            const rowCountEl = document.getElementById("rowCount");
            if (rowCountEl) {
                rowCountEl.textContent = `${visibleCount} baris`;
            }
        });
    }

    link.addEventListener("click", (e) => {

        if (item.password) {
            const enteredPassword = prompt("Enter password:");

            if (enteredPassword !== item.password) {
                alert("Incorrect password.");
                e.preventDefault();
                e.stopPropagation();
                return;
            }
        }

        window.__csvFile = item.file;

        console.log("Selected CSV:", item.file);
        console.log("Label:", item.label);
    });
})();
</script>
