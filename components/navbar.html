<nav class="navbar card">
    <div class="nav-group" id="navGroup">
        <button class="nav-btn is-active"
            hx-get="/pages/home.html"
            hx-target="#content"
            hx-swap="innerHTML"
            hx-indicator="#loading">
            Home
        </button>
    </div>
</nav>

<script>
(function () {
    function setActiveNav(btn) {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("is-active"));
        btn.classList.add("is-active");
    }

    async function buildCsvNav() {
        try {
            const res = await fetch("data/manifest.json");
            const files = await res.json();
            const navGroup = document.getElementById("navGroup");

            files.forEach(item => {
                const btn = document.createElement("button");
                btn.className = "nav-btn";

                // Pakai label dari manifest, bukan nama file mentah
                btn.textContent = item.label.join(" ");

                // Kasih tanda visual kalau item ini butuh password
                if (item.password) {
                    btn.classList.add("nav-btn--locked");
                }

                // Tidak pakai hx-get statis di sini, karena kita perlu
                // cek password dulu SEBELUM htmx melakukan swap.
                btn.addEventListener("click", () => {
                    if (item.password) {
                        const enteredPassword = prompt("Enter password:");

                        if (enteredPassword === null) {
                            return; // Stay on current page
                        }

                        if (enteredPassword !== item.password) {
                            alert("Incorrect password.");
                            return; // Stay on current page
                        }
                    }

                    window.__csvFile = item.file; // simpan file mana yang dipilih
                    setActiveNav(btn);

                    htmx.ajax("GET", "/pages/loadCSV.html", {
                        target: "#content",
                        swap: "innerHTML"
                    });
                });

                navGroup.appendChild(btn);

                // WAJIB: htmx tidak otomatis "melihat" elemen yang
                // ditambahkan lewat JS setelah initial load.
                // htmx.process() memberitahu htmx untuk bind hx-* di elemen ini.
                htmx.process(btn);
            });
        } catch (err) {
            console.error("Gagal membaca manifest CSV:", err);
        }
    }

    buildCsvNav();
})();
</script>
